<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat Assistant</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f3f4f6;
      font-family: Arial, sans-serif;
      color: #1f2937;
    }
    .chat {
      width: min(720px, 94vw);
      height: min(780px, 92vh);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0,0,0,.07);
    }
    header {
      padding: 18px 22px;
      border-bottom: 1px solid #e5e7eb;
      font-size: 18px;
      font-weight: 600;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .message {
      max-width: 82%;
      padding: 11px 14px;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .user {
      align-self: flex-end;
      background: #2563eb;
      color: white;
      border-bottom-right-radius: 4px;
    }
    .bot {
      align-self: flex-start;
      background: #f3f4f6;
      color: #111827;
      border-bottom-left-radius: 4px;
    }
    .error { color: #b91c1c; }
    form {
      display: flex;
      gap: 10px;
      padding: 16px;
      border-top: 1px solid #e5e7eb;
    }
    input {
      flex: 1;
      min-width: 0;
      padding: 13px 14px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      outline: none;
      font-size: 15px;
    }
    input:focus { border-color: #2563eb; }
    button {
      padding: 0 20px;
      border: 0;
      border-radius: 9px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }
    button:disabled { opacity: .55; cursor: not-allowed; }
  </style>
</head>
<body>
  <main class="chat">
    <header>Chat Assistant</header>
    <section id="messages" aria-live="polite">
      <div class="message bot">Hello! How can I help you?</div>
    </section>
    <form id="chat-form">
      <input id="message-input" type="text" placeholder="Type your message..." autocomplete="off" required />
      <button id="send-button" type="submit">Send</button>
    </form>
  </main>

  <script>
    const API_BASE = "http://localhost:8000";
    const form = document.getElementById("chat-form");
    const input = document.getElementById("message-input");
    const messages = document.getElementById("messages");
    const sendButton = document.getElementById("send-button");

    function addMessage(text, type, isError = false) {
      const item = document.createElement("div");
      item.className = `message ${type}${isError ? " error" : ""}`;
      item.textContent = text;
      messages.appendChild(item);
      messages.scrollTop = messages.scrollHeight;
      return item;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const msg = input.value.trim();
      if (!msg) return;

      addMessage(msg, "user");
      input.value = "";
      input.focus();
      sendButton.disabled = true;

      const pending = addMessage("Thinking...", "bot");

      try {
        // The message is URL-encoded because it is sent as a path parameter.
        const response = await fetch(`${API_BASE}/chat/${encodeURIComponent(msg)}`);
        if (!response.ok) {
          throw new Error(`Server returned ${response.status} ${response.statusText}`);
        }

        const contentType = response.headers.get("content-type") || "";
        let reply;
        if (contentType.includes("application/json")) {
          const data = await response.json();
          reply = typeof data === "string"
            ? data
            : (data.response ?? data.reply ?? data.message ?? JSON.stringify(data));
        } else {
          reply = await response.text();
        }

        pending.textContent = reply || "(The server returned an empty response.)";
      } catch (error) {
        pending.textContent = `Could not reach the API: ${error.message}`;
        pending.classList.add("error");
      } finally {
        sendButton.disabled = false;
        messages.scrollTop = messages.scrollHeight;
      }
    });
  </script>
</body>
</html>
